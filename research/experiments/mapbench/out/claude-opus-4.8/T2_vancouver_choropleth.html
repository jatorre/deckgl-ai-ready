<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Vancouver Blocks Choropleth</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
  #map { position: absolute; width: 100%; height: 100%; }
  #legend {
    position: absolute; bottom: 20px; left: 20px; z-index: 10;
    background: rgba(255,255,255,0.9); padding: 12px 14px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 12px; color: #222;
  }
  #legend h4 { margin: 0 0 8px 0; font-size: 13px; }
  .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
  .legend-swatch { width: 18px; height: 14px; margin-right: 8px; border: 1px solid #999; }
  #tooltip {
    position: absolute; z-index: 20; pointer-events: none; display: none;
    background: rgba(0,0,0,0.8); color: #fff; padding: 6px 8px; border-radius: 4px;
    font-size: 12px;
  }
</style>
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>
<div id="legend"><h4>Value per sqm ($)</h4></div>
<div id="tooltip"></div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/visgl/deck.gl-data/master/examples/geojson/vancouver-blocks.json';

// Sequential color scheme (ColorBrewer YlOrRd, 6 classes)
const COLORS = [
  [255, 255, 178],
  [254, 217, 118],
  [254, 178, 76],
  [253, 141, 60],
  [240, 59, 32],
  [189, 0, 38]
];

// Quantile breaks to be computed from data
let BREAKS = [];

function formatNum(n) {
  return n == null ? 'N/A' : Math.round(n).toLocaleString();
}

function colorForValue(v) {
  if (v == null || isNaN(v)) return [200, 200, 200];
  for (let i = 0; i < BREAKS.length; i++) {
    if (v <= BREAKS[i]) return COLORS[i];
  }
  return COLORS[COLORS.length - 1];
}

function computeQuantiles(values, n) {
  const sorted = values.filter(v => v != null && !isNaN(v)).slice().sort((a, b) => a - b);
  const breaks = [];
  for (let i = 1; i <= n; i++) {
    const q = i / n;
    const idx = Math.min(sorted.length - 1, Math.floor(q * (sorted.length - 1)));
    breaks.push(sorted[idx]);
  }
  return breaks;
}

function buildLegend() {
  const legend = document.getElementById('legend');
  let prev = 0;
  for (let i = 0; i < COLORS.length; i++) {
    const c = COLORS[i];
    const row = document.createElement('div');
    row.className = 'legend-row';
    const swatch = document.createElement('div');
    swatch.className = 'legend-swatch';
    swatch.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    const label = document.createElement('span');
    const hi = BREAKS[i];
    label.textContent = `${formatNum(prev)} – ${formatNum(hi)}`;
    prev = hi;
    row.appendChild(swatch);
    row.appendChild(label);
    legend.appendChild(row);
  }
}

const tooltip = document.getElementById('tooltip');

fetch(DATA_URL)
  .then(r => r.json())
  .then(geojson => {
    const values = geojson.features.map(f => f.properties.valuePerSqm);
    BREAKS = computeQuantiles(values, COLORS.length);
    buildLegend();

    const deckgl = new deck.DeckGL({
      container: 'map',
      mapStyle: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      initialViewState: {
        longitude: -123.10,
        latitude: 49.25,
        zoom: 11,
        pitch: 0,
        bearing: 0
      },
      controller: true,
      layers: [
        new deck.GeoJsonLayer({
          id: 'blocks',
          data: geojson,
          filled: true,
          stroked: true,
          getFillColor: f => colorForValue(f.properties.valuePerSqm),
          getLineColor: [255, 255, 255, 180],
          lineWidthMinPixels: 0.5,
          getLineWidth: 1,
          pickable: true,
          onHover: info => {
            if (info.object) {
              const p = info.object.properties;
              tooltip.style.display = 'block';
              tooltip.style.left = info.x + 10 + 'px';
              tooltip.style.top = info.y + 10 + 'px';
              tooltip.innerHTML =
                `<b>Value/sqm:</b> $${formatNum(p.valuePerSqm)}<br>` +
                `<b>Growth:</b> ${p.growth != null ? p.growth.toFixed(3) : 'N/A'}`;
            } else {
              tooltip.style.display = 'none';
            }
          }
        })
      ]
    });
  })
  .catch(err => {
    console.error('Failed to load data:', err);
    alert('Failed to load dataset.');
  });
</script>
</body>
</html>
