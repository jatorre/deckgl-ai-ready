<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vancouver Blocks – Value per m² Choropleth (deck.gl)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 10;
      background: rgba(255,255,255,0.94); border-radius: 6px;
      padding: 10px 14px; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222; box-shadow: 0 1px 6px rgba(0,0,0,0.25); min-width: 190px;
    }
    #legend h3 { margin: 0 0 6px 0; font-size: 13px; font-weight: 600; }
    #legend .sub { color: #666; font-size: 11px; margin-bottom: 6px; }
    #legend .row { display: flex; align-items: center; margin: 2px 0; }
    #legend .swatch { width: 18px; height: 14px; margin-right: 8px; border: 1px solid #999; flex: none; }
    #status {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(255,255,255,0.9); padding: 6px 10px; border-radius: 4px;
      font: 12px system-ui, sans-serif; color: #333;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Loading data…</div>
  <div id="legend">
    <h3>Value per m²</h3>
    <div class="sub">Quantile classes (6), Vancouver blocks</div>
    <div id="legend-rows"></div>
  </div>

  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/visgl/deck.gl-data/master/examples/geojson/vancouver-blocks.json';
    const BASEMAP = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';

    // Sequential ColorBrewer YlOrRd, 6 classes
    const COLORS_HEX = ['#ffffb2', '#fed976', '#feb24c', '#fd8d3c', '#f03b20', '#bd0026'];
    const COLORS = COLORS_HEX.map(h => [
      parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), 200
    ]);
    const N_CLASSES = COLORS.length;

    const fmt = v => Math.round(v).toLocaleString('en-US');

    function quantileBreaks(values, k) {
      const sorted = values.slice().sort((a, b) => a - b);
      const breaks = [];
      for (let i = 1; i < k; i++) {
        const pos = (i / k) * (sorted.length - 1);
        const lo = Math.floor(pos), hi = Math.ceil(pos);
        breaks.push(sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo));
      }
      return breaks; // k-1 upper bounds of the first k-1 classes
    }

    function classify(v, breaks) {
      let i = 0;
      while (i < breaks.length && v > breaks[i]) i++;
      return i;
    }

    const deckgl = new deck.DeckGL({
      container: 'map',
      mapLib: maplibregl,
      mapStyle: BASEMAP,
      initialViewState: {
        longitude: -123.10,
        latitude: 49.25,
        zoom: 11,
        pitch: 0,
        bearing: 0
      },
      controller: true,
      layers: [],
      getTooltip: ({ object }) => {
        if (!object) return null;
        const p = object.properties || {};
        return {
          html: `<div style="font:12px system-ui,sans-serif">
                   <div><b>Value per m²:</b> ${p.valuePerSqm != null ? fmt(p.valuePerSqm) : 'n/a'}</div>
                   <div><b>Growth:</b> ${p.growth != null ? Number(p.growth).toFixed(3) : 'n/a'}</div>
                 </div>`,
          style: { backgroundColor: 'rgba(255,255,255,0.95)', color: '#222', borderRadius: '4px', padding: '6px 8px', boxShadow: '0 1px 4px rgba(0,0,0,0.3)' }
        };
      }
    });

    fetch(DATA_URL)
      .then(r => r.json())
      .then(geojson => {
        const values = geojson.features
          .map(f => f.properties && f.properties.valuePerSqm)
          .filter(v => typeof v === 'number' && isFinite(v));

        const breaks = quantileBreaks(values, N_CLASSES);
        const minV = Math.min.apply(null, values);
        const maxV = Math.max.apply(null, values);

        // Legend
        const rows = document.getElementById('legend-rows');
        rows.innerHTML = '';
        for (let i = 0; i < N_CLASSES; i++) {
          const lo = i === 0 ? minV : breaks[i - 1];
          const hi = i === N_CLASSES - 1 ? maxV : breaks[i];
          const label = i === N_CLASSES - 1
            ? `> ${fmt(lo)}`
            : (i === 0 ? `${fmt(lo)} – ${fmt(hi)}` : `${fmt(lo)} – ${fmt(hi)}`);
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<span class="swatch" style="background:${COLORS_HEX[i]}"></span><span>${label}</span>`;
          rows.appendChild(row);
        }

        const layer = new deck.GeoJsonLayer({
          id: 'vancouver-blocks',
          data: geojson,
          filled: true,
          stroked: true,
          extruded: false,
          pickable: true,
          autoHighlight: true,
          highlightColor: [60, 60, 60, 120],
          lineWidthUnits: 'pixels',
          lineWidthMinPixels: 0.5,
          getLineWidth: 0.5,
          getLineColor: [255, 255, 255, 180],
          getFillColor: f => {
            const v = f.properties && f.properties.valuePerSqm;
            if (typeof v !== 'number' || !isFinite(v)) return [200, 200, 200, 120];
            return COLORS[classify(v, breaks)];
          }
        });

        deckgl.setProps({ layers: [layer] });
        document.getElementById('status').textContent =
          `${geojson.features.length.toLocaleString()} blocks · hover for details`;
      })
      .catch(err => {
        document.getElementById('status').textContent = 'Failed to load data: ' + err;
        console.error(err);
      });
  </script>
</body>
</html>
